# GoReleaser config — see https://goreleaser.com
# Run `goreleaser release --snapshot --clean` locally to test.
version: 2

project_name: qr-gode

before:
  hooks:
    - go mod tidy

builds:
  - id: qr-gode
    main: ./cmd/qr-gode
    binary: qr-gode
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: ahmedtahas
    name: qr-gode
  draft: false
  prerelease: auto
  header: |
    ## qr-gode {{ .Tag }}

    Prebuilt binaries for macOS, Linux, and Windows on amd64/arm64. Verify
    downloads with `checksums.txt`.
  footer: |
    ---
    **Install with `go install`:**
    ```bash
    go install github.com/ahmedtahas/qr-gode/cmd/qr-gode@{{ .Tag }}
    ```

